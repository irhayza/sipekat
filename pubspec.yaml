name: si_pekat
description: "SiPEKAT - App Petugas Jargas"
publish_to: 'none'

version: 1.3.8+9

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP & API
  http: ^1.2.0

  # Auth & Session
  shared_preferences: ^2.2.3

  # Image & Camera
  image_picker: ^1.1.2
  image: ^4.2.0
  exif: ^3.1.1
  flutter_image_compress: ^2.1.0

  # GPS
  geolocator: ^11.0.0

  # OCR (Meter Reading)
  google_mlkit_text_recognition: ^0.14.0

  # State management
  provider: ^6.1.2

  # Offline SQLite database (dipakai modul Kunjungan & OCR)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Konektivitas
  connectivity_plus: ^6.0.3

  # Aksi kontak: telepon, WhatsApp, buka peta
  url_launcher: ^6.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"

